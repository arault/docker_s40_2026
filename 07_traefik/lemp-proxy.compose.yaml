---
name: lempstack-proxy
services:
  websvc:
    image: nginx:${NGINX_IMAGE_TAG}
    container_name: web
    volumes:
      - ./html/:/usr/share/nginx/html/
      - ./nginx-conf/:/etc/nginx/conf.d/
    networks:
      lempnet:
        ipv4_address: ${LEMPNET_PREFIX}.${NGINX_IPV4}
      proxynet:
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxynet
      - traefik.http.routers.web.rule=Host(`www.stage.local`)

  phpsvc:
    image: ${PHP_IMAGE}:${PHP_IMAGE_TAG}
    container_name: php
    volumes:
      - ./html/:/var/www/html/
    networks:
      lempnet:
        ipv4_address: ${LEMPNET_PREFIX}.${PHP_IPV4}
    restart: unless-stopped

  dbsvc:
    image: mariadb:${MARIADB_IMAGE_TAG}
    container_name: db
    volumes:
      - datadb:/var/lib/mysql/
    environment:
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
    networks:
      lempnet:
        ipv4_address: ${LEMPNET_PREFIX}.${MARIADB_IPV4}
    restart: unless-stopped

volumes:
  datadb:

networks:
  lempnet:
    ipam:
      config:
        - subnet: ${LEMPNET_PREFIX}.0.0/16
          gateway: ${LEMPNET_PREFIX}.${LEMPNET_GATEWAY_IPV4}
    driver_opts:
      com.docker.network.bridge.name: lempnet0
  proxynet:
    external: true
