---
name: lempstack-proxy
services:
  websvc:
    image: nginx:1.31
    container_name: web
    volumes:
      - ./html/:/usr/share/nginx/html/
      - ./nginx-conf/:/etc/nginx/conf.d/
    networks:
      lempnet:
        ipv4_address: 172.40.0.100
      proxynet:
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxynet
      - traefik.http.routers.web.rule=Host(`www.stage.local`)

  phpsvc:
    image: localhost:5000/php-mysql:8.5-fpm
    container_name: php
    volumes:
      - ./html/:/var/www/html/
    networks:
      lempnet:
        ipv4_address: 172.40.0.110
    restart: unless-stopped

  dbsvc:
    image: mariadb:12.3
    container_name: db
    volumes:
      - datadb:/var/lib/mysql/
    environment:
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
    networks:
      lempnet:
        ipv4_address: 172.40.0.120
    restart: unless-stopped

volumes:
  datadb:

networks:
  lempnet:
    ipam:
      config:
        - subnet: 172.40.0.0/16
          gateway: 172.40.255.254
    driver_opts:
      com.docker.network.bridge.name: lempnet0
  proxynet:
    external: true
